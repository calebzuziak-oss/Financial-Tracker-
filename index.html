<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0B131B" />
<title>Investment Tracker V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0B131B;
    --card-bg: #13202C;
    --card-bg-hover: #182837;
    --card-inner: #192A3A;
    --border: #233748;
    --border-bright: #364F65;
    --text-main: #F0F4F8;
    --text-muted: #8E9EA9;
    --gold: #D4AF37;
    --gold-glow: rgba(212, 175, 55, 0.15);
    --gold-light: #E5C358;
    --emerald: #2EBE7B;
    --emerald-glow: rgba(46, 190, 123, 0.15);
    --rose: #E55353;
    --rose-glow: rgba(229, 83, 83, 0.15);
    --teal: #38BDF8;
    --purple: #A855F7;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-serif: 'Fraunces', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  .container {
    max-width: 620px;
    margin: 0 auto;
    padding: 16px 14px 40px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-top: 4px;
  }
  .brand-eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-v2 {
    background: var(--gold-glow);
    color: var(--gold);
    border: 1px solid var(--gold);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
  }
  .brand-title {
    font-family: var(--font-serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.02em;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }

  /* Utility Buttons */
  .btn-icon {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-icon:hover, .btn-icon:active {
    color: var(--text-main);
    border-color: var(--border-bright);
    background: var(--card-bg-hover);
  }
  .btn-icon.gold { color: var(--gold); border-color: rgba(212, 175, 55, 0.4); }
  .btn-icon.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Navigation Tabs */
  .tab-bar {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 10px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tab-btn.active {
    background: var(--card-inner);
    color: var(--gold-light);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    border: 1px solid var(--border);
  }

  /* Cards */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
  }

  /* Live Price Banner Card */
  .ticker-card {
    background: linear-gradient(145deg, #13202C 0%, #172635 100%);
    border-color: rgba(212, 175, 55, 0.3);
  }
  .ticker-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .ticker-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ticker-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 8px var(--emerald);
  }
  .ticker-name {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .price-display-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .price-large {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text-main);
  }
  .price-change-pill {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .price-change-pill.positive { background: var(--emerald-glow); color: var(--emerald); border: 1px solid rgba(46,190,123,0.3); }
  .price-change-pill.negative { background: var(--rose-glow); color: var(--rose); border: 1px solid rgba(229,83,83,0.3); }
  
  .ticker-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .status-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--card-inner);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  /* Net Worth Card */
  .networth-card {
    background: linear-gradient(135deg, #192938 0%, #111B24 100%);
    border: 1px solid rgba(212, 175, 55, 0.25);
  }
  .networth-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-weight: 600;
  }
  .networth-amount {
    font-family: var(--font-mono);
    font-size: 34px;
    font-weight: 700;
    color: var(--text-main);
    margin: 4px 0 12px;
    letter-spacing: -0.03em;
  }
  .networth-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .nw-stat-box {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .nw-stat-title { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .nw-stat-val { font-family: var(--font-mono); font-size: 14px; font-weight: 600; margin-top: 2px; }

  /* Allocation Bar */
  .alloc-bar {
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    background: var(--card-inner);
    margin: 10px 0;
  }
  .alloc-segment { height: 100%; transition: width 0.4s ease; }
  .alloc-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* Account Cards */
  .account-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .account-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--card-inner);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    flex-shrink: 0;
  }
  .account-title-area { flex: 1; }
  .account-name { font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
  .account-sub { font-size: 11px; color: var(--text-muted); }

  .stat-grid-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .mini-stat {
    background: var(--card-inner);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .mini-stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .mini-stat-val { font-family: var(--font-mono); font-size: 15px; font-weight: 600; margin-top: 2px; }

  .val-positive { color: var(--emerald); }
  .val-negative { color: var(--rose); }

  /* Progress Bar (IRA limit) */
  .ira-progress-container {
    background: var(--card-inner);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .ira-progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .ira-progress-track {
    height: 6px;
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
    overflow: hidden;
  }
  .ira-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--emerald));
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  /* Ledger List */
  .ledger-list {
    border-top: 1px dashed var(--border);
    margin-top: 10px;
    padding-top: 4px;
  }
  .ledger-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
    font-size: 12px;
  }
  .ledger-date { color: var(--text-muted); width: 75px; font-family: var(--font-mono); flex-shrink: 0; }
  .ledger-details { flex: 1; margin: 0 8px; }
  .ledger-amt { font-family: var(--font-mono); font-weight: 600; color: var(--text-main); }
  .ledger-sub { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .ledger-del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
  }
  .ledger-del:hover { color: var(--rose); background: rgba(229,83,83,0.1); }

  /* Buttons & Forms */
  .btn-action {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--gold);
    background: var(--gold-glow);
    color: var(--gold-light);
    font-weight: 600;
    font-size: 13px;
    font-family: var(--font-sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-action:hover { background: rgba(212, 175, 55, 0.25); color: #FFF; }

  .form-box {
    background: var(--card-inner);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
  }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field-group { display: flex; flex-direction: column; margin-bottom: 8px; }
  .field-group label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
  .field-group input, .field-group select {
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-main);
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 13px;
    width: 100%;
  }
  .field-group input:focus { outline: none; border-color: var(--gold); }
  
  .form-row-btns { display: flex; gap: 8px; margin-top: 6px; }
  .btn-submit { flex: 1; padding: 8px; background: var(--gold); color: var(--bg-dark); border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
  .btn-cancel { flex: 1; padding: 8px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }

  /* Projection & Goal Cards */
  .proj-card {
    background: linear-gradient(145deg, #162432 0%, #111C27 100%);
    border-color: rgba(56, 189, 248, 0.3);
  }
  .proj-slider-group { margin: 12px 0; }
  .proj-slider-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--text-muted); }
  .proj-slider {
    width: 100%;
    accent-color: var(--teal);
    cursor: pointer;
  }
  .chart-container {
    width: 100%;
    height: 180px;
    margin-top: 12px;
    position: relative;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--card-bg);
    border: 1px solid var(--border-bright);
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-title { font-family: var(--font-serif); font-size: 20px; margin-bottom: 12px; color: var(--gold-light); }

  /* Toast Notifications */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card-inner);
    border: 1px solid var(--gold);
    color: var(--text-main);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Utility helpers */
  .num { font-family: var(--font-mono); }
  .empty-state { color: var(--text-muted); font-size: 12px; text-align: center; padding: 14px; font-style: italic; }
  
  @media (max-width: 480px) {
    .brand-title { font-size: 22px; }
    .price-large { font-size: 24px; }
    .networth-amount { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Dynamic JS Content Rendered Here -->
  <div style="text-align:center; padding: 60px 0; color: var(--text-muted);">
    Loading Personal Wealth Terminal...
  </div>
</div>

<!-- Modal Dialog Container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalContent"></div>
</div>

<!-- Global Toast Notification -->
<div class="toast" id="toast">
  <span id="toastMsg">Action complete</span>
</div>

<script>

  const STORAGE_KEY = 'wealth_terminal_v2_data';

  // Default baseline data state
  const DEFAULT_STATE = {

  function fmtUSD(val) {
    return (val || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtShares(val) {
    return (val || 0).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });

  function showToast(msg) {
    const t = document.getElementById('toast');
    const tm = document.getElementById('toastMsg');

    tm.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);

  // Persistence
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { console.error('LocalStorage save error', e); }
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        state = Object.assign({}, DEFAULT_STATE, parsed);
      }
    } catch(e) {
      console.error('LocalStorage load error', e);
    }
    // Perform daily FXAIX price check on app load
    fetchLiveFXAIXPrice(false);
  }

  // Multi-Proxy FXAIX Live Price Engine
  async function fetchLiveFXAIXPrice(forced = false) {
    if (!forced && state.fxaixLastUpdated === todayISO()) {
      render();
      return;
    }

    ui.refreshing = true;
    render();

    const targetUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/FXAIX?range=5d&interval=1d';
    let fetched = false;

    // Direct / Proxy endpoint fallback list
    const fetchEndpoints = [
      targetUrl,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
      `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
    ];

    for (const url of fetchEndpoints) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();
        const result = data?.chart?.result?.[0];
        if (result && result.meta) {
          const meta = result.meta;
          const currentPrice = meta.regularMarketPrice || meta.chartPreviousClose;
          const prevClose = meta.chartPreviousClose || currentPrice;
          
          if (currentPrice && currentPrice > 0) {
            state.fxaixPrice = currentPrice;
            state.fxaixChange = currentPrice - prevClose;
            state.fxaixChangePct = prevClose > 0 ? ((currentPrice - prevClose) / prevClose) * 100 : 0;
            state.fxaixLastUpdated = todayISO();
            state.fxaixSource = 'Live NAV (Daily Sync)';
            fetched = true;
            saveState();
            if (forced) showToast('FXAIX price updated successfully!');
            break;
          }
        }
      } catch (e) {
        // try next fallback
      }
    }

    if (!fetched && forced) {
      showToast('Live fetch busy. Using manual input mode.');
    }

    ui.refreshing = false;
    render();
  }

  // Calculation helpers
  function calcAccountTotals(entries, currentPrice) {
    const invested = entries.reduce((s, e) => s + (e.amount || 0), 0);
    const shares = entries.reduce((s, e) => s + (e.shares || 0), 0);
    const currentValue = shares * currentPrice;
    const gain = currentValue - invested;
    const gainPct = invested > 0 ? (gain / invested) * 100 : 0;
    const avgCostPerShare = shares > 0 ? invested / shares : 0;
    return { invested, shares, currentValue, gain, gainPct, avgCostPerShare };
  }

    if (!app) return;

    const brokerageData = calcAccountTotals(state.brokerage, state.fxaixPrice);
    const rothData = calcAccountTotals(state.rothIra, state.fxaixPrice);
    const currentNetWorth = brokerageData.currentValue + rothData.currentValue + (state.hysa.balance || 0);

    let mainContent = '';

    if (state.activeTab === 'overview') {
      mainContent = `
        ${renderTickerCard()}
        ${renderNetWorthCard(brokerageData, rothData)}
        ${renderAccountCard('brokerage', 'Taxable Brokerage', 'FXAIX Holdings', ICONS.landmark, brokerageData, state.brokerage)}
        ${renderAccountCard('rothIra', 'Roth IRA Account', 'Tax-Advantaged FXAIX', ICONS.piggy, rothData, state.rothIra)}
        ${renderHysaCard()}
      `;
    } else if (state.activeTab === 'projections') {
      mainContent = renderProjectionsTab(currentNetWorth);
    } else if (state.activeTab === 'goals') {
      mainContent = renderGoalsTab(currentNetWorth);
    }

    app.innerHTML = `
      ${renderHeader()}
      ${renderTabs()}
      ${mainContent}
    `;

    attachEventListeners(currentNetWorth);
  }

  /* Event Handler Attachment */
  function attachEventListeners(currentNetWorth) {
    // Tab Switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        state.activeTab = e.currentTarget.dataset.tab;
        saveState();
        render();
      });
    });

    // Refresh Price
    const btnRefresh = document.getElementById('btnRefresh');
    if (btnRefresh) {
      btnRefresh.addEventListener('click', () => fetchLiveFXAIXPrice(true));
    }

    // Export Modal
    const btnExportModal = document.getElementById('btnExportModal');
    if (btnExportModal) {
      btnExportModal.addEventListener('click', openExportModal);
    }

    // Price Edit Actions
    const btnEditPrice = document.getElementById('btnEditPrice');
    if (btnEditPrice) {
      btnEditPrice.addEventListener('click', () => { ui.editingPrice = true; render(); });
    }
    const btnCancelManualPrice = document.getElementById('btnCancelManualPrice');
    if (btnCancelManualPrice) {
      btnCancelManualPrice.addEventListener('click', () => { ui.editingPrice = false; render(); });
    }
    const btnSaveManualPrice = document.getElementById('btnSaveManualPrice');
    if (btnSaveManualPrice) {
      btnSaveManualPrice.addEventListener('click', () => {
        const inp = document.getElementById('manualPriceInput');
        if (inp) {
          const val = parseFloat(inp.value);
          if (val > 0) {
            state.fxaixPrice = val;
            state.fxaixLastUpdated = todayISO();
            state.fxaixSource = 'Manual Entry';
            saveState();
            showToast('Manual price saved!');
          }
        }
        ui.editingPrice = false;
        render();
      });
    }

    // Account Form Toggles & Actions
    document.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', (e) => {
        const btn = e.currentTarget;
        const action = btn.dataset.action;
        const acc = btn.dataset.acc;

        if (action === 'open-form') {
          ui[acc + 'FormOpen'] = true;
          render();
        } else if (action === 'close-form') {
          ui[acc + 'FormOpen'] = false;
          render();
        } else if (action === 'save-entry') {
          saveAccountEntry(acc);
        } else if (action === 'delete-entry') {
          deleteAccountEntry(acc, btn.dataset.id);
        }
      });
    });

    // HYSA Actions
    const btnEditHysa = document.getElementById('btnEditHysa');
    if (btnEditHysa) {
      btnEditHysa.addEventListener('click', () => { ui.editingHysa = true; render(); });
    }
    const btnCancelHysa = document.getElementById('btnCancelHysa');
    if (btnCancelHysa) {
      btnCancelHysa.addEventListener('click', () => { ui.editingHysa = false; render(); });
    }
    const btnSaveHysa = document.getElementById('btnSaveHysa');
    if (btnSaveHysa) {
      btnSaveHysa.addEventListener('click', () => {
        const balInp = document.getElementById('inputHysaBalance');
        const rateInp = document.getElementById('inputHysaRate');
        if (balInp && rateInp) {
          state.hysa.balance = Math.max(parseFloat(balInp.value) || 0, 0);
          state.hysa.rate = Math.max(parseFloat(rateInp.value) || 0, 0);
          saveState();
          showToast('HYSA details updated!');
        }
        ui.editingHysa = false;
        render();
      });
    }

    // Projections Slider Listeners
    if (state.activeTab === 'projections') {
      const sliderContrib = document.getElementById('sliderContrib');
      const sliderReturn = document.getElementById('sliderReturn');

      const updateForecast = () => {
        const contrib = parseFloat(sliderContrib.value) || 0;
        const rate = (parseFloat(sliderReturn.value) || 8) / 100;
        
        document.getElementById('sliderContribVal').textContent = '$' + contrib.toLocaleString() + ' / mo';
        document.getElementById('sliderReturnVal').textContent = (rate * 100).toFixed(1) + '%';

        function calcFutureVal(years) {
          const months = years * 12;
          const rMonthly = rate / 12;
          let total = currentNetWorth * Math.pow(1 + rMonthly, months);
          for (let i = 1; i <= months; i++) {
            total += contrib * Math.pow(1 + rMonthly, months - i);
          }
          return total;
        }

        document.getElementById('proj5yr').textContent = fmtUSD(calcFutureVal(5));
        document.getElementById('proj10yr').textContent = fmtUSD(calcFutureVal(10));
        document.getElementById('proj20yr').textContent = fmtUSD(calcFutureVal(20));
        document.getElementById('proj30yr').textContent = fmtUSD(calcFutureVal(30));
      };

      if (sliderContrib && sliderReturn) {
        sliderContrib.addEventListener('input', updateForecast);
        sliderReturn.addEventListener('input', updateForecast);
        updateForecast();
      }
    }

    // Goal Setter Action
    if (state.activeTab === 'goals') {
      const btnSaveGoal = document.getElementById('btnSaveGoal');
      if (btnSaveGoal) {
        btnSaveGoal.addEventListener('click', () => {
          const val = parseFloat(document.getElementById('inputGoalTarget').value);
          if (val > 0) {
            state.goalTarget = val;
            saveState();
            showToast('Financial goal updated!');
            render();
          }
        });
      }
    }
  }

  function saveAccountEntry(accKey) {
    const dateInp = document.getElementById(`inputDate_${accKey}`);
    const amtInp = document.getElementById(`inputAmt_${accKey}`);
    const priceInp = document.getElementById(`inputPrice_${accKey}`);
    const noteInp = document.getElementById(`inputNote_${accKey}`);

    const amt = parseFloat(amtInp?.value);
    const price = parseFloat(priceInp?.value) || state.fxaixPrice;
    const date = dateInp?.value || todayISO();
    const note = noteInp?.value || '';

    if (!amt || amt <= 0 || !price || price <= 0) {
      showToast('Please enter a valid amount and share price');
      return;
    }

    const shares = amt / price;

    state[accKey].push({
      id: uid(),
      date,
      amount: amt,
      price,
      shares,
      note
    });

    ui[accKey + 'FormOpen'] = false;
    saveState();
    showToast('Investment logged successfully!');
    render();
  }

  function deleteAccountEntry(accKey, id) {
    state[accKey] = state[accKey].filter(item => item.id !== id);
    saveState();
    showToast('Entry removed');
    render();
  }

  // Export / Import Dialog
  function openExportModal() {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    if (!overlay || !content) return;

    const jsonStr = JSON.stringify(state, null, 2);

    content.innerHTML = `
      <h3 class="modal-title">Data Backup & Restore</h3>
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
        Export your portfolio JSON configuration to back up or restore state on another device.
      </div>
      <textarea id="jsonArea" style="width:100%; height:160px; background:var(--bg-dark); border:1px solid var(--border); color:var(--gold-light); font-family:var(--font-mono); font-size:11px; padding:8px; border-radius:8px; resize:none;">${jsonStr}</textarea>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn-cancel" id="btnCloseModal">Close</button>
        <button class="btn-submit" id="btnImportJson">Import JSON Data</button>
      </div>
    `;

    overlay.classList.add('active');

    document.getElementById('btnCloseModal').addEventListener('click', () => overlay.classList.remove('active'));
    document.getElementById('btnImportJson').addEventListener('click', () => {
      try {
        const text = document.getElementById('jsonArea').value;
        const parsed = JSON.parse(text);
        if (parsed && typeof parsed === 'object') {
          state = Object.assign({}, DEFAULT_STATE, parsed);
          saveState();
          overlay.classList.remove('active');
          showToast('Data imported successfully!');
          render();
        }
      } catch (err) {
        showToast('Invalid JSON format!');
      }
    });
  }

  // Initial Bootup
  loadState();
})();
</script>

</body>
</html>
